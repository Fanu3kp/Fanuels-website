<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" fill="none">
  <defs>
    <linearGradient id="erp-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="50%" stop-color="#106ebe"/>
      <stop offset="100%" stop-color="#0067c5"/>
    </linearGradient>
    <linearGradient id="erp-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c10"/>
      <stop offset="100%" stop-color="#006600"/>
    </linearGradient>
    <linearGradient id="erp-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb900"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="erp-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="erp-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="erp-chart-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#106ebe"/>
    </linearGradient>
    <linearGradient id="erp-chart-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#107c10"/>
      <stop offset="100%" stop-color="#006600"/>
    </linearGradient>
    <linearGradient id="erp-chart-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb900"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <filter id="erp-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0078d4" flood-opacity="0.3"/>
    </filter>
    <filter id="erp-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="512" height="384" fill="url(#erp-bg)" rx="20"/>

  <g transform="translate(256, 190)">
    <rect x="-220" y="-160" width="440" height="320" rx="16" fill="url(#erp-panel)" filter="url(#erp-glow)" stroke="rgba(0,120,212,0.1)" stroke-width="2"/>

    <rect x="-180" y="-120" width="50" height="32" rx="4" fill="url(#erp-primary)" filter="url(#erp-card)"/>
    <rect x="-120" y="-120" width="50" height="32" rx="4" fill="url(#erp-primary)" fill-opacity="0.1" filter="url(#erp-card)"/>
    <rect x="-60" y="-120" width="50" height="32" rx="4" fill="url(#erp-primary)" fill-opacity="0.1" filter="url(#erp-card)"/>

    <g transform="translate(-170, -60)">
      <rect x="0" y="0" width="300" height="140" rx="12" fill="url(#erp-panel)" filter="url(#erp-card)"/>
      <rect x="0" y="0" width="300" height="24" rx="12 12 0 0" fill="url(#erp-secondary)" fill-opacity="1"/>

      <g transform="translate(20, 40)">
        <rect x="0" y="0" width="40" height="80" rx="3" fill="url(#erp-chart-1)" filter="url(#erp-card)"/>
        <rect x="10" y="80" width="30" height="20" rx="2" fill="url(#erp-chart-1)" fill-opacity="0.2"/>
      </g>

      <g transform="translate(80, 60)">
        <rect x="0" y="0" width="40" height="60" rx="3" fill="url(#erp-chart-2)" filter="url(#erp-card)"/>
        <rect x="10" y="60" width="30" height="20" rx="2" fill="url(#erp-chart-2)" fill-opacity="0.2"/>
      </g>

      <g transform="translate(140, 30)">
        <rect x="0" y="0" width="40" height="90" rx="3" fill="url(#erp-chart-3)" filter="url(#erp-card)"/>
        <rect x="10" y="90" width="30" height="20" rx="2" fill="url(#erp-chart-3)" fill-opacity="0.2"/>
      </g>
    </g>

    <g transform="translate(130, -60)">
      <rect x="0" y="0" width="180" height="160" rx="12" fill="url(#erp-panel)" filter="url(#erp-card)"/>
      <rect x="0" y="0" width="180" height="24" rx="12 12 0 0" fill="url(#erp-accent)" fill-opacity="1"/>

      <g transform="translate(20, 40)">
        <rect x="0" y="0" width="140" height="20" rx="3" fill="url(#erp-primary)" fill-opacity="0.15" filter="url(#erp-card)"/>
        <rect x="0" y="28" width="140" height="20" rx="3" fill="url(#erp-primary)" fill-opacity="0.15" filter="url(#erp-card)"/>
        <rect x="0" y="56" width="100" height="20" rx="3" fill="url(#erp-primary)" fill-opacity="0.15" filter="url(#erp-card)"/>
      </g>

      <g transform="translate(20, 100)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="url(#erp-accent)" filter="url(#erp-card)"/>
        <rect x="40" y="7" width="100" height="14" rx="2" fill="rgba(0,0,0,0.6)"/>
      </g>
    </g>

    <g transform="translate(-170, 100)">
      <rect x="0" y="0" width="140" height="100" rx="12" fill="url(#erp-panel)" filter="url(#erp-card)"/>
      <rect x="0" y="0" width="140" height="20" rx="12 12 0 0" fill="url(#erp-secondary)" fill-opacity="1"/>

      <g transform="translate(20, 35)">
        <rect x="0" y="0" width="100" height="16" rx="2" fill="url(#erp-secondary)" fill-opacity="0.2"/>
        <rect x="0" y="20" width="80" height="16" rx="2" fill="url(#erp-secondary)" fill-opacity="0.2"/>
      </g>

      <g transform="translate(100, 65)">
        <rect x="0" y="0" width="36" height="32" rx="6" fill="url(#erp-accent)" filter="url(#erp-card)"/>
        <rect x="8" y="8" width="20" height="16" rx="2" fill="rgba(0,0,0,0.5)"/>
      </g>
    </g>
  </g>

  <g transform="translate(256, 90)">
    <rect x="-240" y="-30" width="480" height="10" rx="5" fill="url(#erp-primary)" opacity="0.1"/>
    <rect x="-60" y="-30" width="120" height="10" rx="5" fill="url(#erp-primary)" opacity="0.2"/>
  </g>

  <g transform="translate(400, 260)">
    <polygon points="0,0 30,-10 30,10" fill="url(#erp-primary)" opacity="0.3"/>
    <polygon points="30,0 60,-5 60,5" fill="url(#erp-primary)" opacity="0.2"/>
    <polygon points="60,0 90,-10 90,10" fill="url(#erp-primary)" opacity="0.3"/>
  </g>
</svg>
