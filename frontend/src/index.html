  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Otuya Global — Business & Technology Company">
  <meta name="twitter:description" content="We build POS, apps, websites, ERP. Technology solutions for modern businesses.">
  <meta name="twitter:image" content="/images/real/hero-office.jpg">
</head>
<body>
  <div id="loading-spinner">
    <div class="spinner-el">
      <div class="sp-dot"></div>
      <div class="sp-dot"></div>
      <div class="sp-dot"></div>
    </div>
  </div>
  <app-root></app-root>
  <script>
    // Hide loading spinner once Angular app is ready
    if (window.navigator.userAgent.includes('bot')) {
      document.getElementById('loading-spinner').style.display = 'none';
    }
    document.addEventListener('DOMContentLoaded', function() {
      var retry = setInterval(function() {
        var appRoot = document.querySelector('app-root');
        var ready = (appRoot && appRoot.shadowRoot) || (appRoot && appRoot.innerHTML.trim());
        if (ready) {
          var spinner = document.getElementById('loading-spinner');
          if (spinner) { spinner.style.opacity = '0'; setTimeout(function(){ spinner.remove(); }, 300); }
          clearInterval(retry);
        }
      }, 50);
      // Safety: always remove spinner after 8 seconds even if Angular fails to bootstrap
      setTimeout(function() {
        var spinner = document.getElementById('loading-spinner');
        if (spinner) { spinner.style.display = 'none'; }
      }, 8000);
    });
  </script>
  <style>
    #loading-spinner {
      position: fixed; inset: 0; background: #0b172a; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    .spinner-el { display: flex; gap: 8px; }
    .spinner-el .sp-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #e85c9d, #00bcd4);
      animation: bounce 0.6s ease-in-out both;
    }
    .spinner-el .sp-dot:nth-child(1) { animation-delay: -0.32s; }
    .spinner-el .sp-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>

  <!-- No-JavaScript fallback for WhatsApp in-app browser and older browsers -->
  <noscript>
    <style>
      #loading-spinner { display: none !important; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #0b172a; }
    </style>
    <div style="max-width: 600px; margin: 40px auto; padding: 20px; text-align: center;">

        <p>Email: fanuelotuya2@gmail.com</p>
        <p>Phone: +254705774020</p>
        <p>Location: Waiyaki Way, Nairobi, Kenya</p>
      </div>
      <div>

        <a href="/services" style="display: inline-block; background: #f1f5f9; color: #0b172a; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600;">View Services</a>
      </div>
    </div>
  </noscript>
</body>
</html>
