<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Otuya Global Business &amp; Technology Company</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Otuya Global delivers custom software — POS systems, mobile apps, web platforms, ERP implementations. Senior engineering teams, delivery-focused, accountable to outcomes.">
  <meta name="theme-color" content="#0b1b33">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Preconnect / DNS-prefetch for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Fonts (display=swap ensures text is visible during font load) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

  <!-- Open Graph / WhatsApp preview -->
  <meta property="og:title" content="Otuya Global — Business & Technology Company">
  <meta property="og:description" content="We build POS, apps, websites, ERP. Technology solutions for modern businesses. Senior engineering teams, delivery-focused, accountable to outcomes.">
  <meta property="og:image" content="https://otuyaglobal.duckdns.org/images/hero-office.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:url" content="https://otuyaglobal.duckdns.org/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Otuya Global">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Otuya Global — Business & Technology Company">
  <meta name="twitter:description" content="We build POS, apps, websites, ERP. Technology solutions for modern businesses.">
  <meta name="twitter:image" content="https://otuyaglobal.duckdns.org/images/hero-office.jpg">
</head>
<body>
  <div id="loading-spinner">
    <div class="spinner-el">
      <div class="sp-dot"></div>
      <div class="sp-dot"></div>
      <div class="sp-dot"></div>
    </div>
  </div>
  <app-root></app-root>
  <script>
    // Hide loading spinner once Angular app is ready
    if (window.navigator.userAgent.includes('bot')) {
      document.getElementById('loading-spinner').style.display = 'none';
    }
    document.addEventListener('DOMContentLoaded', function() {
      var retry = setInterval(function() {
        var appRoot = document.querySelector('app-root');
        if (appRoot && appRoot.shadowRoot || appRoot && appRoot.innerHTML.trim()) {
          var spinner = document.getElementById('loading-spinner');
          if (spinner) { spinner.style.opacity = '0'; setTimeout(function(){ spinner.remove(); }, 300); }
          clearInterval(retry);
        }
      }, 50);
    });
  </script>
  <style>
    #loading-spinner {
      position: fixed; inset: 0; background: #0b172a; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    .spinner-el { display: flex; gap: 8px; }
    .spinner-el .sp-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #e85c9d, #00bcd4);
      animation: bounce 0.6s ease-in-out both;
    }
    .spinner-el .sp-dot:nth-child(1) { animation-delay: -0.32s; }
    .spinner-el .sp-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</body>
</html>
