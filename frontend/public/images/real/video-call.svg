<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  
  <!-- Conference table -->
  <ellipse cx="600" cy="650" rx="450" ry="80" fill="#1e1b4b" stroke="#3730a3" stroke-width="2"/>
  
  <!-- Chairs around table -->
  <g fill="#1e1b4b" stroke="#3730a3" stroke-width="1.5">
    <ellipse cx="200" cy="650" rx="40" ry="30"/>
    <ellipse cx="300" cy="680" rx="35" ry="25"/>
    <ellipse cx="900" cy="650" rx="40" ry="30"/>
    <ellipse cx="1000" cy="680" rx="35" ry="25"/>
    <rect x="150" y="450" width="60" height="180" rx="4"/>
    <rect x="1000" y="450" width="60" height="180" rx="4"/>
  </g>
  
  <!-- People silhouettes -->
  <g fill="#4f46e5" opacity="0.8">
    <ellipse cx="200" cy="580" rx="25" ry="50"/>
    <ellipse cx="300" cy="610" rx="22" ry="45"/>
    <ellipse cx="900" cy="580" rx="25" ry="50"/>
    <ellipse cx="1000" cy="610" rx="22" ry="45"/>
    <ellipse cx="450" cy="550" rx="25" ry="60"/>
    <ellipse cx="750" cy="550" rx="25" ry="60"/>
  </g>
  
  <!-- Large display screen -->
  <rect x="350" y="100" width="500" height="300" fill="#0f0c29" rx="12" stroke="#4f46e5" stroke-width="3" filter="url(#neonGlow)"/>
  <rect x="365" y="115" width="470" height="270" fill="#0a081a" rx="8"/>
  
  <!-- Video call UI -->
  <rect x="380" y="130" width="440" height="200" fill="#1e1b4b" rx="6"/>
  <ellipse cx="600" cy="200" rx="80" ry="60" fill="#312e81" filter="url(#neonGlow)"/>
  <ellipse cx="600" cy="200" rx="60" ry="45" fill="#4f46e5"/>
  <ellipse cx="600" cy="190" rx="30" ry="25" fill="#818cf8"/>
  <ellipse cx="600" cy="185" rx="12" ry="10" fill="#312e81"/>
  <ellipse cx="585" cy="175" rx="4" ry="4" fill="white"/>
  <ellipse cx="615" cy="175" rx="4" ry="4" fill="white"/>
  
  <!-- Participant thumbnails -->
  <g fill="#3730a3" stroke="#4f46e5" stroke-width="1">
    <rect x="390" y="350" width="80" height="60" rx="4"/>
    <rect x="480" y="350" width="80" height="60" rx="4"/>
    <rect x="570" y="350" width="80" height="60" rx="4"/>
    <rect x="660" y="350" width="80" height="60" rx="4"/>
    <rect x="750" y="350" width="80" height="60" rx="4"/>
  </g>
  
  <!-- Meeting info -->
  <text x="600" y="440" fill="#c7d2fe" font-family="system-ui" font-size="18" text-anchor="middle" font-weight="600">Sprint Planning — Team Sync</text>
  <text x="600" y="465" fill="#818cf8" font-family="monospace" font-size="14" text-anchor="middle">14 participants • Recording • 42:30</text>
  
  <!-- Laptop on table -->
  <rect x="250" y="500" width="120" height="80" fill="#1e1b4b" rx="4"/>
  <rect x="255" y="505" width="110" height="70" fill="#0a081a" rx="3"/>
  <rect x="260" y="515" width="100" height="15" fill="#312e81" rx="2"/>
  <rect x="260" y="535" width="80" height="10" fill="#4f46e5" rx="2"/>
  <rect x="260" y="550" width="60" height="10" fill="#4f46e5" rx="2"/>
  
  <!-- Notebook -->
  <rect x="830" y="500" width="80" height="100" fill="#fef3c7" rx="2"/>
  <line x1="840" y1="515" x2="900" y2="515" stroke="#92400e" stroke-width="0.5"/>
  <line x1="840" y1="530" x2="900" y2="530" stroke="#92400e" stroke-width="0.5"/>
  <line x1="840" y1="545" x2="890" y2="545" stroke="#92400e" stroke-width="0.5"/>
  <line x1="840" y1="560" x2="880" y2="560" stroke="#92400e" stroke-width="0.5"/>
  
  <!-- Coffee cups -->
  <g fill="#92400e">
    <rect x="180" y="480" width="25" height="35" rx="2"/>
    <rect x="195" y="480" width="10" height="35" rx="0 2 2 0"/>
    <rect x="1000" y="480" width="25" height="35" rx="2"/>
    <rect x="985" y="480" width="10" height="35" rx="2 0 0 2"/>
  </g>
  
  <!-- Whiteboard -->
  <rect x="80" y="120" width="250" height="350" fill="#1e1b4b" rx="8" stroke="#3730a3" stroke-width="2"/>
  <rect x="90" y="130" width="230" height="330" fill="#0a081a" rx="4"/>
  <g stroke="#4f46e5" stroke-width="2" stroke-linecap="round">
    <line x1="110" y1="160" x2="280" y2="160"/>
    <line x1="110" y1="200" x2="260" y2="200"/>
    <line x1="110" y1="240" x2="290" y2="240"/>
    <line x1="110" y1="280" x2="250" y2="280"/>
    <line x1="110" y1="320" x2="270" y2="320"/>
    <line x1="110" y1="360" x2="240" y2="360"/>
  </g>
  <text x="120" y="410" fill="#818cf8" font-family="monospace" font-size="12">// Architecture decisions</text>
  <text x="120" y="430" fill="#818cf8" font-family="monospace" font-size="12">// 1. Microservices over monolith</text>
  <text x="120" y="450" fill="#818cf8" font-family="monospace" font-size="12">// 2. Event-driven async</text>
  <text x="120" y="470" fill="#818cf8" font-family="monospace" font-size="12">// 3. API gateway pattern</text>
  
  <!-- Lighting -->
  <ellipse cx="600" cy="50" rx="200" ry="30" fill="#4f46e5" opacity="0.15" filter="url(#neonGlow)"/>
  <ellipse cx="200" cy="50" rx="100" ry="20" fill="#4f46e5" opacity="0.1"/>
  <ellipse cx="1000" cy="50" rx="100" ry="20" fill="#4f46e5" opacity="0.1"/>
</svg>