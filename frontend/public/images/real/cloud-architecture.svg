<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg5)"/>
  
  <!-- Cloud shape background -->
  <ellipse cx="600" cy="350" rx="350" ry="200" fill="#1e293b" opacity="0.5" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="350" rx="320" ry="180" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="10 5"/>
  
  <!-- Internet -->
  <ellipse cx="600" cy="80" rx="60" ry="40" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="600" y="70" fill="#06b6d4" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">INTERNET</text>
  <circle cx="600" cy="80" r="18" fill="#06b6d4"/>
  <path d="M 585 70 L 585 60 M 600 55 L 615 70 M 615 70 L 615 60" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- CDN / WAF -->
  <rect x="400" y="150" width="400" height="70" fill="#1e293b" rx="12" stroke="#3b82f6" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="600" y="180" fill="#3b82f6" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="600">CDN / WAF — Global Edge (Cloudflare / CloudFront)</text>
  <text x="600" y="205" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">DDoS Protection • TLS Termination • Cache • Geo-routing</text>
  
  <!-- Connection lines from CDN -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 450 220 L 300 300"/>
    <path d="M 600 220 L 600 280"/>
    <path d="M 750 220 L 900 300"/>
  </g>
  
  <!-- Load Balancer -->
  <rect x="520" y="270" width="160" height="50" fill="#1e293b" rx="10" stroke="#22d3ee" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="600" y="295" fill="#22d3ee" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="600">Load Balancer</text>
  <text x="600" y="312" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">ALB / NLB • Health Checks</text>
  
  <!-- Connection lines to AZs -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 520 295 L 200 350"/>
    <path d="M 560 295 L 250 420"/>
    <path d="M 640 295 L 950 350"/>
    <path d="M 680 295 L 1000 420"/>
  </g>
  
  <!-- AZ 1 -->
  <rect x="100" y="320" width="300" height="280" fill="#1e293b" rx="16" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="350" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">AVAILABILITY ZONE A</text>
  
  <!-- Auto Scaling Group -->
  <rect x="120" y="360" width="260" height="220" fill="#0f172a" rx="10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="250" y="385" fill="#22c55e" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Auto Scaling Group</text>
  <text x="250" y="405" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Min: 3 • Desired: 6 • Max: 20</text>
  
  <!-- Instances -->
  <g fill="#1e293b" stroke="#22c55e" stroke-width="1.5" filter="url(#nodeGlow)">
    <rect x="135" y="420" width="100" height="50" rx="6"/>
    <text x="185" y="450" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-01</text>
    <rect x="245" y="420" width="100" height="50" rx="6"/>
    <text x="295" y="450" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-02</text>
    <rect x="135" y="485" width="100" height="50" rx="6"/>
    <text x="185" y="515" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-03</text>
    <rect x="245" y="485" width="100" height="50" rx="6"/>
    <text x="295" y="515" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-04</text>
  </g>
  
  <!-- RDS Primary -->
  <rect x="120" y="550" width="120" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="180" y="572" fill="#f59e0b" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">RDS Primary</text>
  
  <!-- ElastiCache -->
  <rect x="250" y="550" width="120" height="40" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="310" y="572" fill="#a855f7" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">ElastiCache</text>
  
  <!-- AZ 2 -->
  <rect x="800" y="320" width="300" height="280" fill="#1e293b" rx="16" stroke="#334155" stroke-width="1.5"/>
  <text x="950" y="350" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">AVAILABILITY ZONE B</text>
  
  <rect x="820" y="360" width="260" height="220" fill="#0f172a" rx="10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="950" y="385" fill="#22c55e" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Auto Scaling Group</text>
  <text x="950" y="405" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Min: 3 • Desired: 6 • Max: 20</text>
  
  <g fill="#1e293b" stroke="#22c55e" stroke-width="1.5" filter="url(#nodeGlow)">
    <rect x="835" y="420" width="100" height="50" rx="6"/>
    <text x="885" y="450" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-05</text>
    <rect x="945" y="420" width="100" height="50" rx="6"/>
    <text x="995" y="450" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-06</text>
    <rect x="835" y="485" width="100" height="50" rx="6"/>
    <text x="885" y="515" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-07</text>
    <rect x="945" y="485" width="100" height="50" rx="6"/>
    <text x="995" y="515" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">app-08</text>
  </g>
  
  <!-- RDS Replica -->
  <rect x="820" y="550" width="120" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="880" y="572" fill="#f59e0b" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">RDS Replica</text>
  
  <!-- ElastiCache Replica -->
  <rect x="950" y="550" width="120" height="40" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#nodeGlow)"/>
  <text x="1010" y="572" fill="#a855f7" font-family="system-ui" font-size="10" text-anchor="middle" font-weight="600">Cache Replica</text>
  
  <!-- Sync arrows between AZs -->
  <g stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.7" stroke-dasharray="5 3">
    <path d="M 240 570 Q 550 540 880 570"/>
  </g>
  <text x="600" y="540" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">Async Replication</text>
  
  <!-- S3 / Storage at bottom -->
  <rect x="350" y="630" width="500" height="60" fill="#1e293b" rx="12" stroke="#06b6d4" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <text x="600" y="660" fill="#06b6d4" font-family="system-ui" font-size="12" text-anchor="middle" font-weight="600">S3 — Object Storage (Logs • Backups • Assets • Data Lake)</text>
  <text x="600" y="680" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Versioning • Lifecycle • Encryption • Cross-Region Replication</text>
  
  <!-- Monitoring -->
  <rect x="50" y="50" width="180" height="100" fill="#1e293b" rx="8" stroke="#22d3ee" stroke-width="1"/>
  <text x="140" y="80" fill="#22d3ee" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">CloudWatch</text>
  <text x="140" y="105" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Metrics • Logs • Alarms</text>
  <text x="140" y="125" fill="#22c55e" font-family="monospace" font-size="10" text-anchor="middle">● All Healthy</text>
  
  <!-- Cost indicator -->
  <rect x="970" y="50" width="180" height="80" fill="#1e293b" rx="8" stroke="#f59e0b" stroke-width="1"/>
  <text x="1060" y="80" fill="#f59e0b" font-family="system-ui" font-size="11" text-anchor="middle" font-weight="600">Est. Monthly</text>
  <text x="1060" y="110" fill="#fde047" font-family="monospace" font-size="20" text-anchor="middle" font-weight="bold">$2,840</text>
</svg>