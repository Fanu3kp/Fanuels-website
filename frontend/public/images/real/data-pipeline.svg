<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e"/>
      <stop offset="100%" style="stop-color:#164e63"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#075985"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg4)"/>
  
  <!-- Grid background -->
  <g stroke="#22d3ee" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="0" x2="1200" y2="800"/>
    <line x1="1200" y1="0" x2="0" y2="800"/>
    <g>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="500" x2="1200" y2="500"/>
      <line x1="0" y1="600" x2="1200" y2="600"/>
      <line x1="0" y1="700" x2="1200" y2="700"/>
    </g>
  </g>
  
  <!-- Data flow visualization -->
  <g filter="url(#cyanGlow)">
    <!-- Source node -->
    <circle cx="150" cy="400" r="50" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="150" cy="400" r="30" fill="#06b6d4" opacity="0.4"/>
    <text x="150" y="406" fill="white" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">API</text>
    <text x="150" y="460" fill="#a5f3fc" font-family="monospace" font-size="11" text-anchor="middle">Source</text>
    
    <!-- Pipeline arrows -->
    <path d="M 200 400 L 350 400" stroke="#06b6d4" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 400 400 L 550 400" stroke="#22d3ee" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 600 400 L 750 400" stroke="#06b6d4" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 800 400 L 950 400" stroke="#22d3ee" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 1000 400 L 1050 400" stroke="#06b6d4" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
      </marker>
    </defs>
  </g>
  
  <!-- Processing stages -->
  <g font-family="system-ui">
    <!-- Stage 1: Ingest -->
    <rect x="210" y="300" width="140" height="200" fill="url(#cardGrad)" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="280" cy="330" r="25" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <text x="280" y="335" fill="#06b6d4" font-size="20" text-anchor="middle">📥</text>
    <text x="280" y="375" fill="#a5f3fc" font-size="14" text-anchor="middle" font-weight="600">Ingest</text>
    <text x="280" y="395" fill="#67e8f9" font-size="11" text-anchor="middle">Validate & Parse</text>
    <text x="280" y="420" fill="#06b6d4" font-family="monospace" font-size="11" text-anchor="middle">2.4M events/hr</text>
    <rect x="240" y="460" width="80" height="6" fill="#0c4a6e" rx="3"/>
    <rect x="240" y="460" width="60" height="6" rx="3" fill="#06b6d4"/>
    
    <!-- Stage 2: Transform -->
    <rect x="410" y="300" width="140" height="200" fill="url(#cardGrad)" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="480" cy="330" r="25" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
    <text x="480" y="335" fill="#22d3ee" font-size="20" text-anchor="middle">⚙️</text>
    <text x="480" y="375" fill="#a5f3fc" font-size="14" text-anchor="middle" font-weight="600">Transform</text>
    <text x="480" y="395" fill="#67e8f9" font-size="11" text-anchor="middle">Map & Enrich</text>
    <text x="480" y="420" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">1.8M records/s</text>
    <rect x="440" y="460" width="80" height="6" fill="#0c4a6e" rx="3"/>
    <rect x="440" y="460" width="68" height="6" rx="3" fill="#22d3ee"/>
    
    <!-- Stage 3: Process -->
    <rect x="610" y="300" width="140" height="200" fill="url(#cardGrad)" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="680" cy="330" r="25" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <text x="680" y="335" fill="#06b6d4" font-size="20" text-anchor="middle">🔄</text>
    <text x="680" y="375" fill="#a5f3fc" font-size="14" text-anchor="middle" font-weight="600">Process</text>
    <text x="680" y="395" fill="#67e8f9" font-size="11" text-anchor="middle">Aggregate</text>
    <text x="680" y="420" fill="#06b6d4" font-family="monospace" font-size="11" text-anchor="middle">p99: 12ms</text>
    <rect x="640" y="460" width="80" height="6" fill="#0c4a6e" rx="3"/>
    <rect x="640" y="460" width="72" height="6" rx="3" fill="#06b6d4"/>
    
    <!-- Stage 4: Store -->
    <rect x="810" y="300" width="140" height="200" fill="url(#cardGrad)" rx="12" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="880" cy="330" r="25" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
    <text x="880" y="335" fill="#22d3ee" font-size="20" text-anchor="middle">💾</text>
    <text x="880" y="375" fill="#a5f3fc" font-size="14" text-anchor="middle" font-weight="600">Store</text>
    <text x="880" y="395" fill="#67e8f9" font-size="11" text-anchor="middle">Partition & Index</text>
    <text x="880" y="420" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">500GB/day</text>
    <rect x="840" y="460" width="80" height="6" fill="#0c4a6e" rx="3"/>
    <rect x="840" y="460" width="76" height="6" rx="3" fill="#22d3ee"/>
  </g>
  
  <!-- Destination -->
  <circle cx="1050" cy="400" r="50" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="2" filter="url(#cyanGlow)"/>
  <circle cx="1050" cy="400" r="30" fill="#22c55e" opacity="0.4"/>
  <text x="1050" y="406" fill="white" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">DB</text>
  <text x="1050" y="460" fill="#86efac" font-family="monospace" font-size="11" text-anchor="middle">Destination</text>
  
  <!-- Metrics bar at top -->
  <rect x="50" y="50" width="1100" height="120" fill="#075985" opacity="0.5" rx="12" stroke="#22d3ee" stroke-width="1"/>
  <g font-family="monospace" fill="#a5f3fc">
    <text x="100" y="100" font-size="12">THROUGHPUT</text>
    <text x="100" y="130" font-size="28" font-weight="bold" fill="#06b6d4">1.2M events/sec</text>
    <text x="350" y="100" font-size="12">LATENCY (p99)</text>
    <text x="350" y="130" font-size="28" font-weight="bold" fill="#22d3ee">12ms</text>
    <text x="600" y="100" font-size="12">ERROR RATE</text>
    <text x="600" y="130" font-size="28" font-weight="bold" fill="#22c55e">0.003%</text>
    <text x="850" y="100" font-size="12">UPTIME</text>
    <text x="850" y="130" font-size="28" font-weight="bold" fill="#fde047">99.99%</text>
  </g>
  
  <!-- Real-time chart at bottom -->
  <rect x="50" y="550" width="1100" height="200" fill="#075985" opacity="0.5" rx="12" stroke="#22d3ee" stroke-width="1"/>
  <text x="100" y="585" fill="#a5f3fc" font-family="system-ui" font-size="14" font-weight="600">Real-time Throughput (last 5 min)</text>
  <polyline fill="none" stroke="#06b6d4" stroke-width="2" points="
    100,700
    150,680
    200,690
    250,670
    300,685
    350,660
    400,675
    450,650
    500,665
    550,640
    600,655
    650,630
    700,645
    750,620
    800,635
    850,610
    900,625
    950,600
    1000,615
    1050,595
    1100,590
  "/>
  <polyline fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 3" points="
    100,700
    150,695
    200,690
    250,685
    300,680
    350,675
    400,670
    450,665
    500,660
    550,655
    600,650
    650,645
    700,640
    750,635
    800,630
    850,625
    900,620
    950,615
    1000,610
    1050,605
    1100,600
  "/>
  <text x="1020" y="730" fill="#67e8f9" font-family="monospace" font-size="11">Current: 1.2M/s</text>
  <text x="1020" y="745" fill="#86efac" font-family="monospace" font-size="11">Avg: 1.1M/s</text>
</svg>