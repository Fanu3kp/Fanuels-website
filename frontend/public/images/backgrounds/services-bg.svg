<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="url(#gridBg)"/>
  <rect width="1920" height="1080" fill="url(#gradientOverlay)"/>
  <g opacity="0.04" filter="url(#blur)">
    <rect x="100" y="100" width="200" height="200" rx="20" fill="url(#accent1)" transform="rotate(12 200 200)"/>
    <rect x="1620" y="780" width="250" height="150" rx="15" fill="url(#accent2)" transform="rotate(-8 1745 855)"/>
    <rect x="860" y="440" width="180" height="180" rx="25" fill="url(#accent3)" transform="rotate(22 950 530)"/>
    <circle cx="300" cy="800" r="120" fill="url(#accent1)"/>
    <circle cx="1620" cy="280" r="150" fill="url(#accent2)"/>
    <circle cx="960" cy="540" r="100" fill="url(#accent3)"/>
  </g>
  <defs>
    <pattern id="gridBg" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#F1F5F9"/>
      <path d="M80 0 L0 0 L0 80" stroke="#E2E8F0" stroke-width="0.5" fill="none"/>
    </pattern>
    <linearGradient id="gradientOverlay" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
</svg>