# Otuya Global — free-tier deployment on Render.
# Laravel backend (backend/) runs as a Docker service built
# from the root Dockerfile (php:8.2-cli + pdo_pgsql).
services:
  - type: web
    name: otuya-api
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://otuya-api.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: otuya-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: otuya-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: otuya-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: otuya-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: otuya-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        # Live site (DuckDNS custom domain), GitHub Pages, local dev.
        value: http://otuyaglobal.duckdns.org,https://otuyaglobal.duckdns.org,https://otuyaglobal.com,https://www.otuyaglobal.com,https://fanu3kp.github.io,http://localhost:4200,http://127.0.0.1:4200
      # Contact-form email notifications (optional — messages are still
      # saved in the database without these). To enable, uncomment and
      # set a Gmail app password (Google Account > Security > App passwords):
      # - key: MAIL_MAILER
      #   value: smtp
      # - key: MAIL_HOST
      #   value: smtp.gmail.com
      # - key: MAIL_PORT
      #   value: 587
      # - key: MAIL_USERNAME
      #   value: your@gmail.com
      # - key: MAIL_PASSWORD
      #   value: your-16-char-app-password
      # - key: MAIL_FROM_ADDRESS
      #   value: your@gmail.com
      # - key: MAIL_FROM_NAME
      #   value: Otuya Global
      # - key: MAIL_ENCRYPTION
      #   value: tls

databases:
  - name: otuya-db
    databaseName: otuya
    user: otuya
    free: true
