name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# BASE_HREF: the site is served from the domain root
# (custom domain otuyaglobal.duckdns.org), so use "/".
env:
  BASE_HREF: "/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-2026-10
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --base-href="${BASE_HREF}"
        working-directory: frontend

      # SPA fallback: GitHub Pages serves 404.html for unknown routes,
      # so client-side routing (e.g. /services, /contact) keeps working.
      - name: Add SPA fallback
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html
        working-directory: frontend

      # Project sites live under /repo-name/, so absolute asset paths
      # (/images/...) must be rewritten to the project base.
      - name: Rewrite asset paths for project site
        if: env.BASE_HREF != '/'
        run: |
          base="${BASE_HREF#/}"
          base="${base%/}"
          find dist/frontend/browser -type f \( -name "*.js" -o -name "*.css" \) -exec sed -i "s|/images/|/${base}/images/|g" {} +
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
