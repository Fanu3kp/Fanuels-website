name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# BASE_HREF: use "/" for a user/organization site (username.github.io).
# For a project site (username.github.io/repo-name) set it to "/repo-name/"
# and note that absolute /images/... asset paths require a user site.
env:
  BASE_HREF: "/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build -- --base-href="${BASE_HREF}"
        working-directory: frontend

      # SPA fallback: GitHub Pages serves 404.html for unknown routes,
      # so client-side routing (e.g. /services, /contact) keeps working.
      - name: Add SPA fallback
        run: cp dist/frontend/index.html dist/frontend/404.html
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend

  deploy:
    needs: build
    runs-on: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
